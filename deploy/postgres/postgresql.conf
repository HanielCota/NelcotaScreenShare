# postgresql.conf do Nelcota no Coolify ("Custom PostgreSQL configuration").
# ATENÇÃO: o Coolify SUBSTITUI o arquivo inteiro por este. O que não estiver
# aqui volta ao padrão do Postgres.
#
# Perfil: VPS de 4 GB dividida com o app (~2 GB para o Postgres).
# Para 8 GB (~4 GB para o Postgres), use os valores comentados com "8GB:".

listen_addresses = '*'                  # rede interna do Coolify (porta não é publicada)
max_connections = 50                    # 8GB: 100. App usa pool de 10 + job de migração + folga
password_encryption = scram-sha-256

# Memória
shared_buffers = 512MB                  # 8GB: 1GB
effective_cache_size = 1536MB           # 8GB: 3GB
work_mem = 8MB                          # 8GB: 12MB
maintenance_work_mem = 128MB            # 8GB: 256MB

# Disco (SSD/NVMe)
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL e checkpoints
wal_buffers = 16MB
min_wal_size = 512MB                    # 8GB: 1GB
max_wal_size = 2GB                      # 8GB: 4GB
checkpoint_completion_target = 0.9

# Estatísticas e diagnóstico
default_statistics_target = 100
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = top
pg_stat_statements.max = 5000
track_io_timing = on
auto_explain.log_min_duration = '2s'
auto_explain.log_analyze = off

# Logs (vão para o stdout do container; o Coolify mostra)
log_min_duration_statement = 500ms
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
log_timezone = 'America/Sao_Paulo'
timezone = 'UTC'                        # o banco guarda e calcula em UTC; o app converte
