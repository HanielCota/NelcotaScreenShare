name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, formatting, types and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unused code, exports and dependencies (knip)
        run: pnpm knip
        env:
          # The Vitest and Playwright configs (loaded by knip) only enable the integration and
          # E2E projects when this is set; knip reads them but never connects to the database.
          TEST_DATABASE_URL: postgres://knip:knip@127.0.0.1:5432/knip
      - name: Duplication below the threshold (jscpd)
        run: pnpm dup
      - name: Schema and migrations up to date (no pending migration)
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain drizzle)" || { git status drizzle; exit 1; }
      - name: Production dependencies without high/critical vulnerabilities
        run: pnpm audit --prod --audit-level=high

  test:
    name: Tests (unit + integration on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nelcota_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/nelcota_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:scripts
      - name: Docker image (the same as deploy) builds without errors
        run: docker build --tag nelcota-ci .

  e2e:
    name: E2E (real Playwright, Postgres and LiveKit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nelcota_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/nelcota_test
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-0123456789abcdef0123456789abcdef
      LIVEKIT_URL: ws://127.0.0.1:7880
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Development LiveKit
        run: |
          docker run -d --name lk --network host \
            -e LIVEKIT_KEYS="$LIVEKIT_API_KEY: $LIVEKIT_API_SECRET" \
            livekit/livekit-server:v1.13.7 --dev --bind 0.0.0.0 --node-ip 127.0.0.1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
